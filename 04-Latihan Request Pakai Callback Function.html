<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Request Pakai Callback Function</title>
</head>
<body>
  <h1>Latihan Request Pakai Callback Function</h1>
  <button id="btn-get-data">Get Data</button>
  <div id="data-container"></div>

  <button id="btn-get-data-2">Get Data 2</button>

  <script>   

    const btnGetData = document.getElementById('btn-get-data');
    const dataContainer = document.getElementById('data-container');

    btnGetData.addEventListener('click', () => {
      getData((data) => {
        dataContainer.innerHTML = `<p>${data}</p>`;
      });
    });

    function getData(callback) {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://jsonplaceholder.typicode.com/todos/2', true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          callback(JSON.stringify(data, null, 2));
        } else {
          dataContainer.innerHTML = `<p>Error: ${xhr.statusText} (${xhr.status})</p>`;
        }
      };
      xhr.send();
    }
  </script>
</body>
</html>
